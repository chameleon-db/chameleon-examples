# PostgreSQL for the example. The API runs on your machine (`make api`).
services:
  db:
    image: postgres:16
    container_name: chameleon-db
    environment:
      POSTGRES_USER: chameleon
      POSTGRES_PASSWORD: chameleon
      POSTGRES_DB: chameleon
    ports:
      - "5432:5432"
    volumes:
      - chameleon-db-data:/var/lib/postgresql/data

volumes:
  chameleon-db-data:
